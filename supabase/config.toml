# Supabase CLI config. Project ref: jyhaavppeilbxzikuhfg (captain-passage-tool, eu-north-1)
project_id = "captain-passage-tool"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"

# ingest-tick authenticates with x-cron-secret, not a user JWT (PRD §11).
[functions.ingest-tick]
verify_jwt = false
[functions.plan-targets]
verify_jwt = true
[functions.compute-conditions]
verify_jwt = true
[functions.generate-briefing]
verify_jwt = true
